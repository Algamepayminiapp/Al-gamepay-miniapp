<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>AL Gamepay</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

header{
  height:100px;
  display:flex;
  align-items:center;
  padding:0 32px;
  border-bottom:1px solid #222;
  position:sticky;
  top:0;
  background:#050505;
  z-index:20;
}

.logo{
  font-size:30px;
  font-weight:900;
}

.logo span{
  color:#ff1018;
}

.container{
  padding:40px 32px 70px;
  max-width:800px;
  margin:auto;
}

.search{
  width:100%;
  background:#111;
  border:1px solid #333;
  border-radius:26px;
  padding:25px 28px;
  color:white;
  font-size:20px;
  outline:none;
  margin-bottom:42px;
}

.search:focus{
  border-color:#e5151d;
}

h2{
  font-size:30px;
  margin-bottom:28px;
}


/* GAME GRID */

.game-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.game-card{
  min-width:0;
  cursor:pointer;
}

.game-image{
  height:230px;
  border-radius:28px;
  border:1px solid #444;
  overflow:hidden;
  position:relative;
  display:flex;
  align-items:flex-end;
  padding:18px;
  background:
  radial-gradient(circle at 70% 25%,rgba(255,0,0,.35),transparent 35%),
  linear-gradient(145deg,#222,#090909);
}

.game-image.ml{
  background:
  radial-gradient(circle at 70% 25%,rgba(0,115,255,.35),transparent 35%),
  linear-gradient(145deg,#222,#090909);
}

.game-image.heart{
  background:
  radial-gradient(circle at 70% 25%,rgba(255,70,140,.35),transparent 35%),
  linear-gradient(145deg,#222,#090909);
}

.game-name{
  font-size:19px;
  font-weight:800;
}

.game-label{
  margin-top:14px;
  font-size:18px;
  color:#ddd;
}


/* DETAIL */

#detailPage{
  display:none;
}

.back{
  background:#101010;
  border:1px solid #333;
  border-radius:30px;
  padding:27px 30px;
  font-size:22px;
  margin-bottom:28px;
  cursor:pointer;
}

.game-info{
  background:#111;
  border:1px solid #333;
  border-radius:30px;
  padding:25px;
  display:flex;
  gap:22px;
  align-items:center;
  margin-bottom:28px;
}

.detail-logo{
  width:135px;
  height:135px;
  border-radius:25px;
  background:
  radial-gradient(circle,rgba(255,0,0,.4),#191919 60%);
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:900;
  font-size:25px;
  flex-shrink:0;
}

.info-title{
  font-size:28px;
  font-weight:800;
  margin-bottom:12px;
}

.info-desc{
  color:#bbb;
  font-size:17px;
  line-height:1.5;
}


/* ORDER BOX */

.order-section{
  background:#111;
  border:1px solid #333;
  border-radius:30px;
  padding:28px;
  margin-bottom:28px;
}

.id-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-bottom:18px;
}

.input{
  width:100%;
  background:#1b1b1b;
  border:1px solid #333;
  border-radius:20px;
  padding:22px;
  color:white;
  font-size:20px;
  outline:none;
}

.input:focus{
  border-color:#e5151d;
}

#aidBox{
  display:none;
  margin-bottom:18px;
}

.order-box{
  border:1px solid #3a3a3a;
  border-radius:25px;
  padding:25px;
  margin-top:22px;
}

.order-title{
  font-size:24px;
  font-weight:bold;
  margin-bottom:28px;
}

.order-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  font-size:20px;
}

.qty{
  display:flex;
  border:1px solid #444;
  border-radius:40px;
  overflow:hidden;
}

.qty button,
.qty div{
  width:55px;
  height:55px;
  border:0;
  background:#171717;
  color:#fff;
  font-size:22px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.qty button{
  cursor:pointer;
}

.qty div{
  background:#090909;
}

.line{
  border-top:1px solid #333;
  margin:24px 0;
}

.total{
  font-size:24px;
  font-weight:bold;
}


/* PACKAGES */

.package-section{
  background:#0d0d0d;
  border:1px solid #333;
  border-radius:30px;
  overflow:hidden;
  margin-bottom:30px;
}

.package-head{
  padding:27px;
  border-bottom:1px solid #333;
}

.package-head h3{
  font-size:27px;
  margin-bottom:22px;
}

.currency{
  display:inline-block;
  padding:12px 24px;
  background:#c60c14;
  border-radius:12px;
  font-weight:bold;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:22px 27px 0;
}

.tab{
  padding:17px;
  text-align:center;
  background:#151515;
  border:1px solid #333;
  border-radius:15px;
  font-weight:bold;
  cursor:pointer;
}

.tab.active{
  background:#e20d16;
  border-color:#ff242c;
}

.pack-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  padding:27px;
}

.pack{
  min-height:180px;
  border:1px solid #333;
  border-radius:24px;
  padding:22px;
  cursor:pointer;
  position:relative;
  background:
  radial-gradient(circle at 100% 100%,rgba(150,0,0,.18),transparent 40%),
  #111;
}

.pack.selected{
  border:2px solid #ed111b;
}

.pack-name{
  font-size:18px;
  font-weight:bold;
  line-height:1.3;
}

.pack-price{
  font-size:27px;
  font-weight:900;
  margin-top:25px;
  line-height:1.25;
}

.pack-icon{
  position:absolute;
  right:20px;
  bottom:20px;
  font-size:30px;
}


/* RECEIPT */

.receipt-box{
  margin-top:24px;
  border:1px dashed #555;
  border-radius:22px;
  padding:24px;
}

.receipt-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
}

.receipt-desc{
  color:#999;
  margin-bottom:18px;
  line-height:1.5;
}

.file-input{
  width:100%;
  background:#181818;
  padding:16px;
  border-radius:15px;
  color:#ddd;
}

.receipt-preview{
  width:100%;
  max-height:350px;
  object-fit:contain;
  border-radius:18px;
  margin-top:18px;
  display:none;
  background:#080808;
}


/* CONFIRM */

.confirm{
  width:100%;
  border:0;
  border-radius:20px;
  padding:22px;
  font-size:21px;
  font-weight:900;
  background:#ff1018;
  color:#fff;
  margin-top:24px;
  cursor:pointer;
}

.confirm:disabled{
  background:#333;
  color:#777;
  cursor:not-allowed;
}

.notice{
  margin-top:15px;
  color:#999;
  font-size:14px;
  line-height:1.5;
}


/* MOBILE */

@media(max-width:600px){

  header{
    height:95px;
    padding:0 32px;
  }

  .logo{
    font-size:27px;
  }

  .container{
    padding:38px 32px 70px;
  }

  .game-grid{
    gap:12px;
  }

  .game-image{
    height:210px;
    padding:14px;
    border-radius:25px;
  }

  .game-name{
    font-size:16px;
  }

  .game-label{
    font-size:15px;
  }

  .detail-logo{
    width:120px;
    height:120px;
  }

  .info-title{
    font-size:25px;
  }
}

@media(max-width:420px){

  .container{
    padding-left:22px;
    padding-right:22px;
  }

  header{
    padding-left:22px;
    padding-right:22px;
  }

  .game-image{
    height:185px;
  }

  .game-name{
    font-size:14px;
  }

  .game-label{
    font-size:14px;
  }

  .game-info{
    padding:18px;
    gap:15px;
  }

  .detail-logo{
    width:100px;
    height:110px;
    font-size:20px;
  }

  .info-title{
    font-size:23px;
  }

  .id-grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .input{
    padding:18px 15px;
    font-size:17px;
  }

  .pack-grid{
    padding:18px;
    gap:12px;
  }

  .pack{
    min-height:165px;
    padding:18px 15px;
  }

  .pack-price{
    font-size:23px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">AL <span>GAMEPAY</span></div>
</header>


<!-- HOME -->

<div class="container" id="homePage">

  <input
    class="search"
    id="search"
    placeholder="Search games..."
    oninput="filterGames()"
  >

  <h2>Game Top-Up</h2>

  <div class="game-grid" id="gameGrid"></div>

</div>


<!-- DETAIL PAGE -->

<div class="container" id="detailPage">

  <div class="back" onclick="goHome()">
    ← Back to Products
  </div>

  <div class="game-info">

    <div class="detail-logo" id="detailLogo">
      GAME
    </div>

    <div>
      <div class="info-title" id="detailTitle"></div>
      <div class="info-desc" id="detailDesc"></div>
    </div>

  </div>


  <div class="order-section">

    <div class="id-grid">

      <input
        class="input"
        id="userId"
        placeholder="User ID"
        inputmode="numeric"
        oninput="updateConfirm()"
      >

      <input
        class="input"
        id="zoneId"
        placeholder="Zone ID"
        inputmode="numeric"
        oninput="updateConfirm()"
      >

    </div>

    <div id="aidBox">
      <input
        class="input"
        id="aid"
        placeholder="AID"
        oninput="updateConfirm()"
      >
    </div>


    <div class="order-box">

      <div class="order-title">
        Your Order
      </div>

      <div class="order-row">

        <span id="selectedText">
          Select a package
        </span>

        <div class="qty">

          <button onclick="changeQty(-1)">
            −
          </button>

          <div id="qty">
            1
          </div>

          <button onclick="changeQty(1)">
            +
          </button>

        </div>

      </div>

      <div class="line"></div>

      <div class="order-row total">

        <span>Total</span>

        <span id="total">
          -
        </span>

      </div>

      <div class="notice">
        Max 10 per purchase.
      </div>

    </div>


    <!-- RECEIPT -->

    <div class="receipt-box">

      <div class="receipt-title">
        ငွေလွှဲပြေစာ
      </div>

      <div class="receipt-desc">
        ငွေလွှဲပြီးပါက Screenshot / Receipt ပုံကို
        ဒီနေရာမှာ ထည့်ပေးပါ။
      </div>

      <input
        class="file-input"
        id="receipt"
        type="file"
        accept="image/*"
        onchange="previewReceipt(event)"
      >

      <img
        id="receiptPreview"
        class="receipt-preview"
        alt="Receipt Preview"
      >

    </div>


    <button
      class="confirm"
      id="confirmBtn"
      onclick="confirmOrder()"
      disabled
    >
      Confirm Order
    </button>

  </div>


  <div class="package-section">

    <div class="package-head">

      <h3>Available Packages</h3>

      <div class="currency">
        MMK
      </div>

    </div>

    <div
      class="tabs"
      id="pubgTabs"
      style="display:none"
    >

      <div
        class="tab active"
        id="ucTab"
        onclick="setPubgTab('uc')"
      >
        UC
      </div>

      <div
        class="tab"
        id="packTab"
        onclick="setPubgTab('packs')"
      >
        Packs
      </div>

    </div>

    <div class="pack-grid" id="packageGrid"></div>

  </div>

</div>


<script>

/* ===============================
   GAME DATA
================================ */

const games = [

{
  id:"pubg",
  name:"PUBG Mobile",
  short:"PUBG",
  className:"",
  description:
  "Waiting Time (5 seconds) ⚡ User ID နှင့် Zone ID ဖြည့်ပါ။",

  uc:[
    ["60 UC",4000],
    ["325 UC",19900],
    ["660 UC",39900],
    ["1800 UC",99700],
    ["3850 UC",198400],
    ["8100 UC",394600]
  ],

  packs:[
    ["First Purchase Pack",3900],
    ["Upgradable Firearm Pack",11700],
    ["Mythic Emblem Pack",19600],
    ["Weekly Mythic Pack",11800],
    ["Prime - 1 Month",3900],
    ["Prime Plus - 1 Month",39200],
    ["Weekly Deal Pack 1",4000],
    ["Weekly Deal Pack 2",11800],
    ["Prime - 3 Months",11700],
    ["Prime - 6 Months",23500],
    ["Prime - 12 Months",47000],
    ["Prime Plus - 3 Month",117600],
    ["Prime Plus - 6 Months",233400],
    ["Prime Plus - 12 Months",467000],
    ["Elite Pass Plus LV1-100",107800]
  ]
},

{
  id:"mlbb",
  name:"Mobile Legends",
  short:"MLBB",
  className:"ml",
  description:
  "User ID နှင့် Zone ID ဖြည့်ပြီး Package ရွေးပါ။",

  packages:[
    ["55 Diamond",3200],
    ["165 Diamond",9700],
    ["275 Diamond",15600],
    ["565 Diamond",32100],
    ["Weekly Pass",6300],
    ["86 Diamond",5100],
    ["172 Diamond",10200],
    ["257 Diamond",14800],
    ["706 Diamond",40000],
    ["2195 Diamond",121000],
    ["3688 Diamond",201800],
    ["5532 Diamond",304700],
    ["9288 Diamond",506100],
    ["Monthly Epic Bundle",16400],
    ["Weekly Elite Bundle",3200],
    ["Twilight Pass",33500]
  ]
},

{
  id:"heartopia",
  name:"Heartopia",
  short:"HEART",
  className:"heart",
  description:
  "User ID, Zone ID နှင့် AID ကို ဖြည့်ပေးပါ။",

  packages:[
    ["20 Heart Diamond",2400],
    ["60 Heart Diamond",4700],
    ["320 Heart Diamond",23400],
    ["730 Heart Diamond",47200],
    ["1370 Heart Diamond",88300],
    ["2130 Heart Diamond",136000],
    ["3550 Heart Diamond",224600],
    ["7050 Heart Diamond",436700]
  ]
}

];


/* ===============================
   VARIABLES
================================ */

let currentGame = null;
let selectedPackage = null;
let quantity = 1;
let pubgTab = "uc";
let receiptSelected = false;


/* ===============================
   HOME GAMES
================================ */

function renderGames(list){

  const grid =
    document.getElementById("gameGrid");

  grid.innerHTML = "";

  list.forEach(game=>{

    const card =
      document.createElement("div");

    card.className =
      "game-card";

    card.onclick =
      ()=>openGame(game.id);

    card.innerHTML = `

      <div class="game-image ${game.className}">
        <div class="game-name">
          ${game.name}
        </div>
      </div>

      <div class="game-label">
        ${game.name}
      </div>

    `;

    grid.appendChild(card);

  });

}


/* ===============================
   SEARCH
================================ */

function filterGames(){

  const value =
    document
    .getElementById("search")
    .value
    .toLowerCase();

  const filtered =
    games.filter(game=>
      game.name
      .toLowerCase()
      .includes(value)
    );

  renderGames(filtered);

}


/* ===============================
   OPEN GAME
================================ */

function openGame(id){

  currentGame =
    games.find(game=>game.id===id);

  if(!currentGame){
    return;
  }

  selectedPackage = null;
  quantity = 1;
  receiptSelected = false;

  document.getElementById("homePage")
    .style.display="none";

  document.getElementById("detailPage")
    .style.display="block";

  document.getElementById("detailTitle")
    .textContent=currentGame.name;

  document.getElementById("detailLogo")
    .textContent=currentGame.short;

  document.getElementById("detailDesc")
    .textContent=currentGame.description;

  document.getElementById("userId").value="";
  document.getElementById("zoneId").value="";
  document.getElementById("aid").value="";

  document.getElementById("qty")
    .textContent="1";

  document.getElementById("selectedText")
    .textContent="Select a package";

  document.getElementById("total")
    .textContent="-";

  document.getElementById("receipt")
    .value="";

  document.getElementById("receiptPreview")
    .style.display="none";


  /* Heartopia AID */

  document.getElementById("aidBox")
    .style.display =
      currentGame.id==="heartopia"
      ? "block"
      : "none";


  /* PUBG tabs */

  if(currentGame.id==="pubg"){

    document.getElementById("pubgTabs")
      .style.display="grid";

    setPubgTab("uc");

  }else{

    document.getElementById("pubgTabs")
      .style.display="none";

    renderPackages(
      currentGame.packages
    );

  }

  updateConfirm();

  window.scrollTo(0,0);

}


/* ===============================
   PUBG TAB
================================ */

function setPubgTab(type){

  pubgTab = type;

  selectedPackage = null;
  quantity = 1;

  document.getElementById("qty")
    .textContent="1";

  document.getElementById("selectedText")
    .textContent="Select a package";

  document.getElementById("total")
    .textContent="-";


  document.getElementById("ucTab")
    .classList.toggle(
      "active",
      type==="uc"
    );

  document.getElementById("packTab")
    .classList.toggle(
      "active",
      type==="packs"
    );


  if(type==="uc"){

    renderPackages(
      currentGame.uc
    );

  }else{

    renderPackages(
      currentGame.packs
    );

  }

  updateConfirm();

}


/* ===============================
   PACKAGES
================================ */

function renderPackages(packages){

  const grid =
    document.getElementById(
      "packageGrid"
    );

  grid.innerHTML="";

  packages.forEach((pack,index)=>{

    const div =
      document.createElement("div");

    div.className="pack";

    div.onclick =
      ()=>selectPackage(
        pack,
        div
      );

    div.innerHTML = `

      <div class="pack-name">
        ${pack[0]}
      </div>

      <div class="pack-price">
        ${Number(pack[1]).toLocaleString()}
        <br>
        MMK
      </div>

      <div class="pack-icon">
        🎫
      </div>

    `;

    grid.appendChild(div);

  });

}


/* ===============================
   SELECT PACKAGE
================================ */

function selectPackage(pack,element){

  selectedPackage = {
    name:pack[0],
    price:Number(pack[1])
  };

  quantity=1;

  document.getElementById("qty")
    .textContent=quantity;

  document
    .querySelectorAll(".pack")
    .forEach(el=>
      el.classList.remove("selected")
    );

  element.classList.add("selected");

  updateOrder();
  updateConfirm();

}


/* ===============================
   QUANTITY
================================ */

function changeQty(amount){

  if(!selectedPackage){
    return;
  }

  quantity += amount;

  if(quantity<1){
    quantity=1;
  }

  if(quantity>10){
    quantity=10;
  }

  document.getElementById("qty")
    .textContent=quantity;

  updateOrder();

}


/* ===============================
   ORDER TOTAL
================================ */

function updateOrder(){

  if(!selectedPackage){

    document.getElementById("selectedText")
      .textContent="Select a package";

    document.getElementById("total")
      .textContent="-";

    return;
  }

  document.getElementById("selectedText")
    .textContent =
      selectedPackage.name;

  const total =
    selectedPackage.price *
    quantity;

  document.getElementById("total")
    .textContent =
      total.toLocaleString()
      +" MMK";

}


/* ===============================
   RECEIPT PREVIEW
================================ */

function previewReceipt(event){

  const file =
    event.target.files[0];

  const preview =
    document.getElementById(
      "receiptPreview"
    );

  if(!file){

    receiptSelected=false;
    preview.style.display="none";

    updateConfirm();
    return;
  }

  if(!file.type.startsWith("image/")){

    alert(
      "ငွေလွှဲပြေစာ ပုံဖိုင်ကိုသာ ထည့်ပေးပါ။"
    );

    event.target.value="";
    receiptSelected=false;

    updateConfirm();
    return;
  }

  receiptSelected=true;

  const reader =
    new FileReader();

  reader.onload=function(e){

    preview.src=e.target.result;
    preview.style.display="block";

  };

  reader.readAsDataURL(file);

  updateConfirm();

}


/* ===============================
   CONFIRM BUTTON
================================ */

function updateConfirm(){

  const userId =
    document
    .getElementById("userId")
    .value
    .trim();

  const zoneId =
    document
    .getElementById("zoneId")
    .value
    .trim();

  const aid =
    document
    .getElementById("aid")
    .value
    .trim();

  let valid =
    currentGame &&
    selectedPackage &&
    userId &&
    zoneId &&
    receiptSelected;

  if(
    currentGame &&
    currentGame.id==="heartopia"
  ){
    valid = valid && aid;
  }

  document.getElementById(
    "confirmBtn"
  ).disabled = !valid;

}


/* ===============================
   CONFIRM ORDER
================================ */

function confirmOrder(){

  if(!currentGame ||
     !selectedPackage){
    return;
  }

  const userId =
    document
    .getElementById("userId")
    .value
    .trim();

  const zoneId =
    document
    .getElementById("zoneId")
    .value
    .trim();

  const aid =
    document
    .getElementById("aid")
    .value
    .trim();

  const total =
    selectedPackage.price *
    quantity;


  let message =
`Order Confirmed!
