<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>AL Gamepay</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  background:#050505;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

.header{
  height:105px;
  display:flex;
  align-items:center;
  padding:0 20px;
  border-bottom:1px solid #242424
}

.logo{
  font-size:28px;
  font-weight:900
}

.logo span{
  color:#ff1515
}

.page{
  display:none
}

.page.active{
  display:block
}

.home,
.product{
  padding:25px 18px 60px
}

.search{
  width:100%;
  height:72px;
  padding:0 22px;
  border:1px solid #333;
  border-radius:22px;
  background:#111;
  color:#fff;
  font-size:21px;
  outline:none
}

.search::placeholder{
  color:#777
}

.title{
  margin:35px 0 28px;
  font-size:29px
}

/* HOME GAME CARDS */

.game-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px
}

.game-card{
  height:210px;
  border:1px solid #3b3b3b;
  border-radius:22px;
  background-size:cover;
  background-position:center;
  position:relative;
  overflow:hidden
}

.game-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.78),transparent 60%)
}

.game-card.pubg{
  background-image:url("pubg.jpg")
}

.game-card.mlbb{
  background-image:url("mlbb.jpg")
}

.game-card.heart{
  background-image:url("heartopia.jpg")
}

.game-name{
  position:absolute;
  left:12px;
  right:8px;
  bottom:12px;
  z-index:2;
  font-size:16px;
  font-weight:800
}

.game-label{
  margin:14px 5px 0;
  color:#ddd;
  font-size:15px
}

/* PRODUCT */

.back{
  width:100%;
  padding:24px;
  margin-bottom:24px;
  border:1px solid #333;
  border-radius:24px;
  background:#101010;
  color:#fff;
  text-align:left;
  font-size:21px
}

.game-info{
  display:flex;
  align-items:center;
  gap:16px;
  padding:18px;
  border:1px solid #333;
  border-radius:26px;
  background:#111
}

.game-cover{
  width:100px;
  height:110px;
  flex:0 0 100px;
  border-radius:20px;
  background-size:cover;
  background-position:center
}

.info-title{
  font-size:24px;
  font-weight:800;
  margin-bottom:8px
}

.info-desc{
  color:#aaa;
  font-size:15px;
  line-height:1.5
}

/* INPUT + ORDER */

.order-box{
  margin-top:24px;
  padding:17px;
  border:1px solid #333;
  border-radius:26px;
  background:#101010
}

.inputs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.field{
  width:100%;
  height:64px;
  padding:0 16px;
  border:1px solid #333;
  border-radius:18px;
  background:#1a1a1a;
  color:#fff;
  font-size:18px;
  outline:none
}

.save-row{
  display:flex;
  gap:12px;
  align-items:center;
  margin:20px 0;
  color:#ccc;
  font-size:15px;
  line-height:1.4
}

.save-row input{
  width:26px;
  height:26px
}

.summary{
  padding:20px;
  border:1px solid #333;
  border-radius:22px
}

.summary h3{
  font-size:24px;
  margin-bottom:22px
}

.summary-row,
.total-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px
}

.summary-row{
  color:#bbb
}

.quantity{
  display:flex;
  border:1px solid #444;
  border-radius:28px;
  overflow:hidden
}

.quantity button,
.quantity span{
  width:52px;
  height:52px;
  border:0;
  background:#151515;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px
}

.quantity span{
  background:#090909
}

.total-row{
  border-top:1px solid #333;
  margin-top:20px;
  padding-top:20px;
  font-size:22px
}

.note{
  margin-top:12px;
  color:#777;
  font-size:14px
}

/* PACKAGES */

.packages{
  margin-top:25px;
  border:1px solid #333;
  border-radius:26px;
  overflow:hidden;
  background:#101010
}

.package-head{
  padding:20px;
  border-bottom:1px solid #292929
}

.package-head h2{
  font-size:24px
}

.tabs{
  display:flex;
  gap:10px;
  margin-top:16px
}

.tab{
  flex:1;
  height:50px;
  border:1px solid #444;
  border-radius:14px;
  background:#151515;
  color:#fff;
  font-weight:700
}

.tab.active{
  background:#ed151d;
  border-color:#ed151d
}

.package-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:16px
}

.package{
  position:relative;
  min-height:175px;
  padding:16px 14px 68px;
  border:1px solid #333;
  border-radius:22px;
  background:
    radial-gradient(circle at 100% 100%,rgba(100,0,0,.16),transparent 36%),
    #141414
}

.package.selected{
  border:2px solid #ff1717
}

.package-name{
  font-size:16px;
  font-weight:700;
  line-height:1.3
}

.price{
  margin-top:24px;
  font-size:23px;
  font-weight:900;
  line-height:1.25
}

/* ICONS - small and lower right */

.icon-img{
  position:absolute;
  right:12px;
  bottom:12px;
  width:48px;
  height:48px;
  object-fit:contain;
  border-radius:6px
}

.uc-icon{
  width:48px;
  height:48px
}

.heart-icon{
  width:48px;
  height:48px
}

/* MLBB 6 icons from one image */

.diamond-icon{
  position:absolute;
  right:12px;
  bottom:12px;
  width:50px;
  height:50px;
  background-image:url("mlbb-diamond.png");
  background-repeat:no-repeat;
  background-size:300% 200%
}

.d1{background-position:0 0}
.d2{background-position:50% 0}
.d3{background-position:100% 0}
.d4{background-position:0 100%}
.d5{background-position:50% 100%}
.d6{background-position:100% 100%}

/* PAYMENT */

.payment{
  margin-top:25px;
  padding:20px;
  border:1px solid #333;
  border-radius:26px;
  background:#101010
}

.payment h2{
  font-size:25px;
  margin-bottom:10px
}

.payment-text{
  color:#aaa;
  line-height:1.5
}

.upload{
  margin-top:18px;
  padding:22px;
  text-align:center;
  border:1px dashed #666;
  border-radius:20px;
  background:#171717
}

.hidden-file{
  display:none
}

.choose-file{
  display:inline-block;
  padding:11px 20px;
  background:#fff;
  color:#111;
  border-radius:9px;
  font-weight:700
}

.file-name{
  margin-top:10px;
  color:#aaa;
  font-size:13px;
  word-break:break-word
}

.preview{
  display:none;
  width:100%;
  max-height:320px;
  margin-top:16px;
  border-radius:16px;
  object-fit:contain
}

.confirm{
  width:100%;
  min-height:68px;
  margin-top:18px;
  border:0;
  border-radius:18px;
  background:#f01820;
  color:#fff;
  font-size:20px;
  font-weight:800
}

.confirm:disabled{
  background:#292929;
  color:#777
}

.success{
  display:none;
  margin-top:16px;
  padding:20px;
  border:1px solid #175f2b;
  border-radius:18px;
  background:#0c2012;
  line-height:1.6
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">AL <span>GAMEPAY</span></div>
</header>

<!-- HOME -->

<section id="homePage" class="page active">
<div class="home">

<input
  id="searchInput"
  class="search"
  placeholder="Search games..."
  oninput="searchGames()"
>

<h1 class="title">Game Top-Up</h1>

<div class="game-grid">

  <div class="game-wrap" data-name="pubg mobile">
    <div class="game-card pubg" onclick="openGame('pubg')">
      <div class="game-name">PUBG Mobile</div>
    </div>
    <div class="game-label">PUBG Mobile</div>
  </div>

  <div class="game-wrap" data-name="mobile legends mlbb">
    <div class="game-card mlbb" onclick="openGame('mlbb')">
      <div class="game-name">Mobile Legends</div>
    </div>
    <div class="game-label">Mobile Legends</div>
  </div>

  <div class="game-wrap" data-name="heartopia">
    <div class="game-card heart" onclick="openGame('heartopia')">
      <div class="game-name">Heartopia</div>
    </div>
    <div class="game-label">Heartopia</div>
  </div>

</div>
</div>
</section>


<!-- PRODUCT -->

<section id="productPage" class="page">
<div class="product">

<button class="back" onclick="goHome()">
← Back to Products
</button>

<div class="game-info">

  <div id="gameCover" class="game-cover"></div>

  <div>
    <div id="gameTitle" class="info-title"></div>
    <div id="gameDesc" class="info-desc"></div>
  </div>

</div>


<div class="order-box">

<div class="inputs">

<input
  id="userId"
  class="field"
  placeholder="User ID"
  oninput="validateOrder()"
>

<input
  id="zoneId"
  class="field"
  placeholder="Zone ID"
  style="display:none"
  oninput="validateOrder()"
>

<input
  id="aidInput"
  class="field"
  placeholder="AID"
  style="display:none"
  oninput="validateOrder()"
>

<input
  id="serverInput"
  class="field"
  placeholder="Server"
  style="display:none"
  oninput="validateOrder()"
>

</div>

<label class="save-row">
<input type="checkbox">
<span>Save ID information for next purchase on this device</span>
</label>


<div class="summary">

<h3>Your Order</h3>

<div class="summary-row">

<span id="selectedPackageText">
Select a package
</span>

<div class="quantity">

<button onclick="changeQty(-1)">−</button>

<span id="qty">1</span>

<button onclick="changeQty(1)">+</button>

</div>

</div>


<div class="total-row">

<span>Total</span>

<strong id="total">−</strong>

</div>

<div class="note">
Max 10 per purchase.
</div>

</div>

</div>


<!-- PACKAGES -->

<div class="packages">

<div class="package-head">

<h2>Available Packages</h2>

<div id="pubgTabs" class="tabs" style="display:none">

<button
  id="ucTab"
  class="tab active"
  onclick="setPubgTab('uc')"
>
UC
</button>

<button
  id="packsTab"
  class="tab"
  onclick="setPubgTab('packs')"
>
Packs
</button>

</div>

</div>

<div
  id="packageGrid"
  class="package-grid"
></div>

</div>


<!-- PAYMENT -->

<div class="payment">

<h2>Payment Receipt</h2>

<div class="payment-text">
ငွေလွှဲပြီးပါက ငွေလွှဲပြေစာ Screenshot ကို အောက်မှာထည့်ပါ။
</div>

<div class="upload">

<input
  id="receipt"
  class="hidden-file"
  type="file"
  accept="image/*"
  onchange="previewReceipt(event)"
>

<label
  for="receipt"
  class="choose-file"
>
Choose File
</label>

<div
  id="fileName"
  class="file-name"
></div>

</div>

<img
  id="receiptPreview"
  class="preview"
>

<button
  id="confirmBtn"
  class="confirm"
  onclick="confirmOrder()"
  disabled
>
Select a Package First
</button>

<div
  id="successBox"
  class="success"
></div>

</div>

</div>
</section>


<script>

const games={

pubg:{
  title:"PUBG Mobile",
  cover:"pubg.jpg",
  desc:"User ID ဖြည့်ပြီး Package ရွေးချယ်ပါ။",

  uc:[
    ["60 UC",4000],
    ["325 UC",19900],
    ["660 UC",39900],
    ["1800 UC",99700],
    ["3850 UC",198400],
    ["8100 UC",394600]
  ],

  packs:[
    ["First Purchase Pack",3900],
    ["Upgradable Firearm Pack",11700],
    ["Mythic Emblem Pack",19600],
    ["Weekly Mythic Pack",11800],
    ["Prime - 1 Month",3900],
    ["Prime Plus - 1 Month",39200],
    ["Weekly Deal Pack 1",4000],
    ["Weekly Deal Pack 2",11800],
    ["Prime - 3 Months",11700],
    ["Prime - 6 Months",23500],
    ["Prime - 12 Months",47000],
    ["Prime Plus - 3 Month",117600],
    ["Prime Plus - 6 Months",233400],
    ["Prime Plus - 12 Months",467000],
    ["Elite Pass Plus LV1-100",107800]
  ]
},

mlbb:{
  title:"Mobile Legends Global",
  cover:"mlbb.jpg",
  desc:"User ID နှင့် Zone ID ဖြည့်ပြီး Package ရွေးချယ်ပါ။",

  packages:[
    ["55 Diamond",3200],
    ["165 Diamond",9700],
    ["275 Diamond",15600],
    ["565 Diamond",32100],
    ["Weekly Pass",6300],
    ["86 Diamond",5100],
    ["172 Diamond",10200],
    ["257 Diamond",14800],
    ["706 Diamond",40000],
    ["2195 Diamond",121000],
    ["3688 Diamond",201800],
    ["5532 Diamond",304700],
    ["9288 Diamond",506100],
    ["Monthly Epic Bundle",16400],
    ["Weekly Elite Bundle",3200],
    ["Twilight Pass",33500]
  ]
},

heartopia:{
  title:"Heartopia",
  cover:"heartopia.jpg",
  desc:"User ID, AID နှင့် Server ဖြည့်ပြီး Package ရွေးချယ်ပါ။",

  packages:[
    ["20 Heart Diamond",2400],
    ["60 Heart Diamond",4700],
    ["320 Heart Diamond",23400],
    ["730 Heart Diamond",47200],
    ["1370 Heart Diamond",88300],
    ["2130 Heart Diamond",136000],
    ["3550 Heart Diamond",224600],
    ["7050 Heart Diamond",436700],
    ["GAMG Junior Membership",2800],
    ["GAMG Full Membership",13800],
    ["Gilded Acorn Pack",23400],
    ["Gilded Acorn Pack Upgrade",26400],
    ["Premium Gilded Acorn",47200]
  ]
}

};


let currentGame=null;
let currentTab="uc";
let selectedPackage=null;
let quantity=1;


function openGame(game){

currentGame=game;
selectedPackage=null;
quantity=1;

const data=games[game];

homePage.classList.remove("active");
productPage.classList.add("active");

gameTitle.textContent=data.title;
gameDesc.textContent=data.desc;

gameCover.style.backgroundImage=
`url("${data.cover}")`;

userId.value="";
zoneId.value="";
aidInput.value="";
serverInput.value="";

userId.style.display="block";
zoneId.style.display="none";
aidInput.style.display="none";
serverInput.style.display="none";

if(game==="mlbb"){
  zoneId.style.display="block";
}

if(game==="heartopia"){
  aidInput.style.display="block";
  serverInput.style.display="block";
}

receipt.value="";
fileName.textContent="";
receiptPreview.style.display="none";
successBox.style.display="none";

pubgTabs.style.display=
game==="pubg"
? "flex"
: "none";

currentTab="uc";

if(game==="pubg"){
  ucTab.classList.add("active");
  packsTab.classList.remove("active");
}

renderPackages();
updateSummary();

window.scrollTo(0,0);

}


function goHome(){

productPage.classList.remove("active");
homePage.classList.add("active");

currentGame=null;
selectedPackage=null;

window.scrollTo(0,0);

}


function searchGames(){

const value=
searchInput.value
.toLowerCase()
.trim();

document
.querySelectorAll(".game-wrap")
.forEach(card=>{

card.style.display=
card.dataset.name.includes(value)
? "block"
: "none";

});

}


function setPubgTab(tab){

currentTab=tab;
selectedPackage=null;
quantity=1;

ucTab.classList.toggle(
"active",
tab==="uc"
);

packsTab.classList.toggle(
"active",
tab==="packs"
);

renderPackages();
updateSummary();

}


function getPackages(){

if(currentGame==="pubg"){
  return games.pubg[currentTab];
}

return games[currentGame].packages;

}


function diamondTier(name){

const match=name.match(/\d+/);

if(!match) return 2;

const n=Number(match[0]);

if(n<=86) return 1;
if(n<=172) return 2;
if(n<=275) return 3;
if(n<=706) return 4;
if(n<=2195) return 5;

return 6;

}


function packageIcon(name){

if(currentGame==="pubg"){

return `
<img
src="uc.jpg"
class="icon-img uc-icon"
>
`;

}

if(currentGame==="heartopia"){

return `
<img
src="heartdiamond.webp"
class="icon-img heart-icon"
>
`;

}

if(currentGame==="mlbb"){

const tier=
diamondTier(name);

return `
<div
class="diamond-icon d${tier}"
></div>
`;

}

return "";

}


function renderPackages(){

const list=getPackages();

packageGrid.innerHTML="";

list.forEach((item,index)=>{

const card=
document.createElement("div");

card.className="package";

card.innerHTML=`

<div class="package-name">
${item[0]}
</div>

<div class="price">
${item[1].toLocaleString()}
<br>
MMK
</div>

${packageIcon(item[0])}

`;

card.onclick=()=>{

document
.querySelectorAll(".package")
.forEach(x=>
x.classList.remove("selected")
);

card.classList.add("selected");

selectedPackage={
  name:item[0],
  price:item[1]
};

quantity=1;

updateSummary();

};

packageGrid.appendChild(card);

});

}


function changeQty(amount){

if(!selectedPackage) return;

quantity+=amount;

if(quantity<1) quantity=1;
if(quantity>10) quantity=10;

updateSummary();

}


function updateSummary(){

qty.textContent=quantity;

if(!selectedPackage){

selectedPackageText.textContent=
"Select a package";

total.textContent="−";

confirmBtn.textContent=
"Select a Package First";

validateOrder();

return;

}

selectedPackageText.textContent=
selectedPackage.name;

total.textContent=
(
selectedPackage.price *
quantity
).toLocaleString()
+" MMK";

confirmBtn.textContent=
"Confirm Order";

validateOrder();

}


function previewReceipt(event){

const file=
event.target.files[0];

if(!file){

receiptPreview.style.display="none";
fileName.textContent="";
validateOrder();

return;

}

if(!file.type.startsWith("image/")){

alert(
"ငွေလွှဲပြေစာ ပုံဖိုင်ကိုသာ ထည့်ပေးပါ။"
);

event.target.value="";

return;

}

fileName.textContent=
file.name;

const reader=
new FileReader();

reader.onload=e=>{

receiptPreview.src=
e.target.result;

receiptPreview.style.display=
"block";

};

reader.readAsDataURL(file);

validateOrder();

}


function validateOrder(){

if(!currentGame){
  confirmBtn.disabled=true;
  return;
}

const u=userId.value.trim();
const z=zoneId.value.trim();
const a=aidInput.value.trim();
const s=serverInput.value.trim();

const r=
receipt.files.length>0;

let valid=false;

if(currentGame==="pubg"){
  valid=
  !!(
    selectedPackage &&
    u &&
    r
  );
}

if(currentGame==="mlbb"){
  valid=
  !!(
    selectedPackage &&
    u &&
    z &&
    r
  );
}

if(currentGame==="heartopia"){
  valid=
  !!(
    selectedPackage &&
    u &&
    a &&
    s &&
    r
  );
}

confirmBtn.disabled=
!valid;

}


function confirmOrder(){

if(
!currentGame ||
!selectedPackage
){
return;
}

const u=
userId.value.trim();

const z=
zoneId.value.trim();

const a=
aidInput.value.trim();

const s=
serverInput.value.trim();

const receiptFile=
receipt.files[0];

const orderTotal=
selectedPackage.price *
quantity;

let extra="";

if(currentGame==="mlbb"){

extra+=
`Zone ID: ${safe(z)}<br>`;

}

if(currentGame==="heartopia"){

extra+=
`AID: ${safe(a)}<br>`;

extra+=
`Server: ${safe(s)}<br>`;

}

successBox.style.display=
"block";

successBox.innerHTML=`

<strong>
Order Confirmed ✓
</strong>

<br><br>

Game:
${games[currentGame].title}

<br>

User ID:
${safe(u)}

<br>

${extra}

Package:
${safe(selectedPackage.name)}

<br>

Quantity:
${quantity}

<br>

Total:
${orderTotal.toLocaleString()}
MMK

<br>

Receipt:
${safe(receiptFile.name)}

`;

successBox.scrollIntoView({
  behavior:"smooth",
  block:"center"
});

}


function safe(value){

return String(value)

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

</script>

</body>
</html>
