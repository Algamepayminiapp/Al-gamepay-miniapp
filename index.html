<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>AL Gamepay</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#050505;
  --card:#111;
  --card2:#181818;
  --red:#ff111c;
  --white:#fff;
  --muted:#aaa;
  --border:#303030;
}

body{
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
}

button,input{
  font-family:inherit;
}

.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
}


/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:30;
  background:#050505;
  border-bottom:1px solid #222;
  padding:22px 20px;
}

.logo{
  font-size:25px;
  font-weight:900;
}

.logo span{
  color:var(--red);
}


/* HOME */

.home{
  padding:22px 18px;
}

.search input{
  width:100%;
  background:#111;
  border:1px solid var(--border);
  color:white;
  padding:16px;
  border-radius:17px;
  font-size:16px;
  outline:none;
}

.section-title{
  margin:25px 0 15px;
  font-size:23px;
}

.games{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.game-card{
  background:transparent;
  border:0;
  color:white;
  text-align:left;
}

.game-cover{
  height:250px;
  border-radius:20px;
  border:1px solid #383838;
  padding:14px;
  display:flex;
  align-items:flex-end;
  position:relative;
  overflow:hidden;
}

.pubg{
  background:
  radial-gradient(circle at 60% 25%,rgba(255,170,0,.30),transparent 35%),
  linear-gradient(145deg,#262015,#080808);
}

.mlbb{
  background:
  radial-gradient(circle at 65% 20%,rgba(0,120,255,.30),transparent 35%),
  linear-gradient(145deg,#13202c,#080808);
}

.heartopia{
  background:
  radial-gradient(circle at 60% 20%,rgba(255,80,140,.30),transparent 35%),
  linear-gradient(145deg,#26151f,#080808);
}

.region{
  position:absolute;
  top:10px;
  left:10px;
  background:#390005;
  border:1px solid #9b0008;
  border-radius:20px;
  padding:6px 9px;
  font-size:11px;
  font-weight:bold;
}

.cover-name{
  font-weight:900;
  font-size:17px;
}

.game-name{
  margin:9px 4px;
  font-size:14px;
}


/* DETAIL */

.detail{
  display:none;
  padding:20px 18px 40px;
}

.back{
  width:100%;
  background:#101010;
  border:1px solid var(--border);
  border-radius:20px;
  color:white;
  padding:17px;
  font-size:17px;
  text-align:left;
  margin-bottom:18px;
}

.product-info{
  display:flex;
  gap:16px;
  align-items:center;
  background:#111;
  border:1px solid var(--border);
  border-radius:22px;
  padding:16px;
  margin-bottom:18px;
}

.product-icon{
  width:105px;
  height:105px;
  min-width:105px;
  background:
  radial-gradient(circle at 60% 20%,rgba(255,0,0,.45),transparent 35%),
  #1b1b1b;
  border:1px solid #333;
  border-radius:20px;
  display:grid;
  place-items:center;
  font-size:21px;
  font-weight:900;
}

.product-info h2{
  font-size:23px;
  margin-bottom:8px;
}

.product-info p{
  color:#bbb;
  font-size:14px;
  line-height:1.5;
}


/* ORDER FORM */

.form-card{
  background:#111;
  border:1px solid var(--border);
  border-radius:22px;
  padding:16px;
  margin-bottom:20px;
}

.id-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.input{
  width:100%;
  background:#1a1a1a;
  border:1px solid #303030;
  color:white;
  padding:15px;
  border-radius:15px;
  font-size:16px;
  outline:none;
}

.input:focus{
  border-color:var(--red);
}

.aid-wrap{
  display:none;
  margin-top:12px;
}

.label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

.required{
  color:red;
}

.save-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin:16px 0;
  color:#ddd;
  font-size:14px;
}

.save-row input{
  width:20px;
  height:20px;
  accent-color:red;
}


/* ORDER SUMMARY */

.order-box{
  border:1px solid #333;
  background:#0b0b0b;
  border-radius:18px;
  padding:16px;
}

.order-box h3{
  font-size:20px;
  margin-bottom:18px;
}

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.selected{
  color:#bbb;
  flex:1;
}

.qty{
  display:flex;
  border:1px solid #444;
  border-radius:30px;
  overflow:hidden;
}

.qty button{
  width:44px;
  height:44px;
  background:#181818;
  border:0;
  color:white;
  font-size:21px;
}

.qty span{
  display:grid;
  place-items:center;
  width:48px;
  font-weight:bold;
}

.line{
  border:none;
  border-top:1px solid #303030;
  margin:18px 0;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:18px;
}

.max{
  margin-top:11px;
  color:#777;
  font-size:12px;
}


/* RECEIPT */

.receipt{
  margin-top:18px;
}

.receipt h3{
  font-size:17px;
  margin-bottom:9px;
}

.upload{
  display:block;
  background:#181818;
  border:1px dashed #555;
  border-radius:16px;
  padding:16px;
  text-align:center;
  color:#ddd;
}

.upload input{
  width:100%;
  margin-top:10px;
}

#receiptPreview{
  display:none;
  width:100%;
  max-height:300px;
  object-fit:contain;
  border-radius:15px;
  margin-top:12px;
  border:1px solid #333;
}

.confirm{
  width:100%;
  border:0;
  margin-top:18px;
  border-radius:16px;
  padding:16px;
  background:var(--red);
  color:white;
  font-size:17px;
  font-weight:900;
}

.confirm:disabled{
  background:#222;
  color:#777;
  border:1px solid #444;
}


/* PACKAGES */

.pack-section{
  background:#0d0d0d;
  border:1px solid #333;
  border-radius:22px;
  overflow:hidden;
}

.pack-head{
  padding:18px;
  border-bottom:1px solid #292929;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.pack-head h3{
  font-size:22px;
}

.mmk{
  background:#8e0008;
  padding:9px 16px;
  border-radius:10px;
  font-weight:bold;
  font-size:13px;
}

.count{
  border:1px solid #555;
  border-radius:30px;
  width:45px;
  height:38px;
  display:grid;
  place-items:center;
}

.pubg-tabs{
  display:none;
  padding:15px 16px 0;
  gap:10px;
}

.tab{
  flex:1;
  background:#161616;
  border:1px solid #383838;
  color:white;
  border-radius:13px;
  padding:13px;
  font-size:15px;
  font-weight:bold;
}

.tab.active{
  background:var(--red);
  border-color:var(--red);
}

.package-grid{
  padding:16px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.package-card{
  min-height:155px;
  border:1px solid #333;
  background:
  radial-gradient(circle at 90% 90%,rgba(255,0,0,.10),transparent 30%),
  #151515;
  border-radius:19px;
  color:white;
  padding:15px;
  text-align:left;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.package-card.active{
  border-color:var(--red);
  box-shadow:inset 0 0 0 1px var(--red);
}

.package-name{
  font-weight:bold;
  line-height:1.4;
}

.package-price{
  font-size:22px;
  font-weight:900;
}

.package-price small{
  display:block;
  margin-top:4px;
  font-size:15px;
}


/* CONFIRM MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.80);
  padding:20px;
  align-items:center;
  justify-content:center;
}

.modal-card{
  width:100%;
  max-width:520px;
  background:#121212;
  border:1px solid #383838;
  border-radius:22px;
  padding:20px;
}

.modal-card h2{
  margin-bottom:17px;
}

.summary{
  background:#090909;
  border:1px solid #303030;
  border-radius:16px;
  padding:15px;
  line-height:1.9;
  font-size:14px;
}

.receipt-small{
  width:100%;
  max-height:220px;
  object-fit:contain;
  margin-top:13px;
  border-radius:13px;
}

.modal-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:17px;
}

.cancel{
  padding:14px;
  border-radius:14px;
  background:#222;
  color:white;
  border:1px solid #444;
}

.confirm-final{
  padding:14px;
  border-radius:14px;
  background:red;
  color:white;
  border:0;
  font-weight:bold;
}

.success{
  display:none;
  text-align:center;
  padding:20px;
}

.success h2{
  color:#fff;
  margin-bottom:10px;
}

.success p{
  color:#bbb;
  line-height:1.5;
}

@media(max-width:500px){

  .game-cover{
    height:220px;
  }

  .cover-name{
    font-size:15px;
  }

  .package-card{
    min-height:145px;
  }

}

</style>
</head>


<body>

<div class="app">

<header>
  <div class="logo">
    AL <span>GAMEPAY</span>
  </div>
</header>


<!-- HOME -->

<main id="homePage" class="home">

  <div class="search">
    <input id="searchInput" placeholder="Search games...">
  </div>

  <h2 class="section-title">
    Game Top-Up
  </h2>

  <div id="gameGrid" class="games"></div>

</main>


<!-- DETAIL -->

<main id="detailPage" class="detail">

  <button id="backBtn" class="back">
    ← Back to Products
  </button>


  <section class="product-info">

    <div id="productIcon" class="product-icon">
      AL
    </div>

    <div>
      <h2 id="productName">Game</h2>

      <p id="productDesc">
        User ID နှင့် Zone ID ဖြည့်ပါ။
      </p>
    </div>

  </section>


  <section class="form-card">

    <div class="id-grid">

      <input
        id="userId"
        class="input"
        placeholder="User ID"
      >

      <input
        id="zoneId"
        class="input"
        placeholder="Zone ID"
      >

    </div>


    <div id="aidWrap" class="aid-wrap">

      <label class="label">
        AID
        <span class="required">*</span>
      </label>

      <input
        id="aid"
        class="input"
        placeholder="AID"
      >

    </div>


    <label class="save-row">

      <input type="checkbox">

      Save ID information for next purchase on this device

    </label>


    <div class="order-box">

      <h3>Your Order</h3>

      <div class="order-top">

        <div id="selectedText" class="selected">
          Select a package
        </div>

        <div class="qty">

          <button id="minusBtn">−</button>

          <span id="qtyText">1</span>

          <button id="plusBtn">+</button>

        </div>

      </div>


      <hr class="line">


      <div class="total">

        <span>Total</span>

        <strong id="totalText">
          —
        </strong>

      </div>

      <div class="max">
        Max 10 per purchase.
      </div>

    </div>


    <!-- RECEIPT -->

    <div class="receipt">

      <h3>ငွေလွှဲပြေစာ *</h3>

      <label class="upload">

        ငွေလွှဲပြေစာ Screenshot / Photo ရွေးပါ

        <input
          id="receiptInput"
          type="file"
          accept="image/*"
        >

      </label>

      <img id="receiptPreview">

    </div>


    <button
      id="confirmBtn"
      class="confirm"
      disabled>

      Confirm Order

    </button>

  </section>


  <section class="pack-section">

    <div class="pack-head">

      <div>

        <h3>Available Packages</h3>

        <div style="margin-top:12px">
          <span class="mmk">MMK</span>
        </div>

      </div>

      <div id="packCount" class="count">
        0
      </div>

    </div>


    <div id="pubgTabs" class="pubg-tabs">

      <button
        id="ucTab"
        class="tab active">

        UC

      </button>

      <button
        id="packsTab"
        class="tab">

        Packs

      </button>

    </div>


    <div
      id="packageGrid"
      class="package-grid">
    </div>

  </section>

</main>

</div>



<!-- CONFIRM MODAL -->

<div id="modal" class="modal">

  <div class="modal-card">

    <div id="reviewArea">

      <h2>Confirm Order</h2>

      <div
        id="summary"
        class="summary">
      </div>

      <img
        id="modalReceipt"
        class="receipt-small">

      <div class="modal-actions">

        <button
          id="cancelBtn"
          class="cancel">

          Back

        </button>

        <button
          id="finalBtn"
          class="confirm-final">

          Confirm

        </button>

      </div>

    </div>


    <div
      id="successArea"
      class="success">

      <h2>✅ Order Confirmed</h2>

      <p>
        Order အချက်အလက်များ အဆင်သင့်ဖြစ်ပါပြီ။
        Telegram Bot ပို့ခြင်းကို နောက်အဆင့်မှာ ချိတ်ဆက်ပါမယ်။
      </p>

      <button
        id="doneBtn"
        class="confirm"
        style="margin-top:20px">

        Done

      </button>

    </div>

  </div>

</div>



<script>

var games = [

{
 id:"pubg",
 name:"PUBG Mobile",
 short:"PUBG",
 className:"pubg",
 region:"REGIONS 4",

 description:
 "Waiting Time (5 seconds) ⚡ User ID နှင့် Zone ID ဖြည့်ပါ။",

 uc:[
  ["60 UC",4000],
  ["325 UC",19900],
  ["660 UC",39900],
  ["1800 UC",99700],
  ["3850 UC",198400],
  ["8100 UC",394600]
 ],

 packs:[
  ["First Purchase Pack",3900],
  ["Upgradable Firearm Pack",11700],
  ["Mythic Emblem Pack",19600],
  ["Weekly Mythic Pack",11800],
  ["Prime - 1 Month",3900],
  ["Prime Plus - 1 Month",39200],
  ["Weekly Deal Pack 1",4000],
  ["Weekly Deal Pack 2",11800],
  ["Prime - 3 Months",11700],
  ["Prime - 6 Months",23500],
  ["Prime - 12 Months",47000],
  ["Prime Plus - 3 Month",117600],
  ["Prime Plus - 6 Months",233400],
  ["Prime Plus - 12 Months",467000],
  ["Elite Pass Plus LV1-100",107800]
 ]
},


{
 id:"mlbb",
 name:"Mobile Legends",
 short:"MLBB",
 className:"mlbb",
 region:"REGIONS 2",

 description:
 "Waiting Time (5 seconds) ⚡ User ID နှင့် Zone ID ဖြည့်ပါ။",

 packages:[
  ["55 Diamond",3200],
  ["165 Diamond",9700],
  ["275 Diamond",15600],
  ["565 Diamond",32100],
  ["Weekly Pass",6300],
  ["86 Diamond",5100],
  ["172 Diamond",10200],
  ["257 Diamond",14800],
  ["706 Diamond",40000],
  ["2195 Diamond",121000],
  ["3688 Diamond",201800],
  ["5532 Diamond",304700],
  ["9288 Diamond",506100],
  ["Monthly Epic Bundle",16400],
  ["Weekly Elite Bundle",3200],
  ["Twilight Pass",33500]
 ]
},


{
 id:"heartopia",
 name:"Heartopia",
 short:"HT",
 className:"heartopia",
 region:"",

 description:
 "User ID နှင့် AID မှန်ကန်စွာ ဖြည့်ပေးပါ။",

 packages:[
  ["20 Heart Diamond",2400],
  ["60 Heart Diamond",4700],
  ["320 Heart Diamond",23400],
  ["730 Heart Diamond",47200],
  ["1370 Heart Diamond",88300],
  ["2130 Heart Diamond",136000],
  ["3550 Heart Diamond",224600],
  ["7050 Heart Diamond",436700]
 ]
}

];


var currentGame = null;
var selectedPackage = null;
var quantity = 1;
var receiptData = null;


var gameGrid =
document.getElementById("gameGrid");

var homePage =
document.getElementById("homePage");

var detailPage =
document.getElementById("detailPage");

var userId =
document.getElementById("userId");

var zoneId =
document.getElementById("zoneId");

var aid =
document.getElementById("aid");

var aidWrap =
document.getElementById("aidWrap");

var selectedText =
document.getElementById("selectedText");

var qtyText =
document.getElementById("qtyText");

var totalText =
document.getElementById("totalText");

var confirmBtn =
document.getElementById("confirmBtn");

var packageGrid =
document.getElementById("packageGrid");

var pubgTabs =
document.getElementById("pubgTabs");

var receiptInput =
document.getElementById("receiptInput");

var receiptPreview =
document.getElementById("receiptPreview");



function renderGames(list){

 gameGrid.innerHTML="";

 list.forEach(function(game){

  var button =
  document.createElement("button");

  button.className="game-card";

  var region="";

  if(game.region){

   region=
   '<div class="region">'+
   game.region+
   '</div>';

  }

  button.innerHTML=

  '<div class="game-cover '+game.className+'">'+

   region+

   '<div class="cover-name">'+
   game.name+
   '</div>'+

  '</div>'+

  '<div class="game-name">'+
  game.name+
  '</div>';


  button.onclick=function(){

   openGame(game);

  };


  gameGrid.appendChild(button);

 });

}



function openGame(game){

 currentGame=game;

 selectedPackage=null;

 quantity=1;

 receiptData=null;

 qtyText.textContent="1";

 selectedText.textContent=
 "Select a package";

 totalText.textContent="—";

 confirmBtn.disabled=true;

 receiptInput.value="";

 receiptPreview.style.display="none";


 document.getElementById(
 "productName"
 ).textContent=game.name;


 document.getElementById(
 "productIcon"
 ).textContent=game.short;


 document.getElementById(
 "productDesc"
 ).textContent=game.description;


 userId.value="";
 zoneId.value="";
 aid.value="";


 if(game.id==="heartopia"){

  aidWrap.style.display="block";

 }else{

  aidWrap.style.display="none";

 }


 if(game.id==="pubg"){

  pubgTabs.style.display="flex";

  document
  .getElementById("ucTab")
  .classList.add("active");

  document
  .getElementById("packsTab")
  .classList.remove("active");

  renderPackages(game.uc);

 }else{

  pubgTabs.style.display="none";

  renderPackages(game.packages);

 }


 homePage.style.display="none";

 detailPage.style.display="block";

 window.scrollTo(0,0);

}



function renderPackages(list){

 packageGrid.innerHTML="";

 document.getElementById(
 "packCount"
 ).textContent=list.length;


 list.forEach(function(item){

  var name=item[0];

  var price=item[1];


  var button=
  document.createElement("button");

  button.className="package-card";


  button.innerHTML=

  '<div class="package-name">'+
  name+
  '</div>'+

  '<div class="package-price">'+
  price.toLocaleString()+
  '<small>MMK</small>'+
  '</div>';


  button.onclick=function(){

   document
   .querySelectorAll(
   ".package-card"
   )
   .forEach(function(card){

    card.classList.remove(
    "active"
    );

   });


   button.classList.add(
   "active"
   );


   selectedPackage={
    name:name,
    price:price
   };


   quantity=1;

   qtyText.textContent="1";

   selectedText.textContent=name;

   updateTotal();

   validateOrder();

  };


  packageGrid.appendChild(button);

 });

}



function updateTotal(){

 if(!selectedPackage){

  totalText.textContent="—";

  return;

 }

 var total=
 selectedPackage.price*
 quantity;

 totalText.textContent=
 total.toLocaleString()+
 " MMK";

}



document
.getElementById("minusBtn")
.onclick=function(){

 if(quantity>1){

  quantity--;

  qtyText.textContent=quantity;

  updateTotal();

 }

};



document
.getElementById("plusBtn")
.onclick=function(){

 if(quantity<10){

  quantity++;

  qtyText.textContent=quantity;

  updateTotal();

 }

};



document
.getElementById("ucTab")
.onclick=function(){

 this.classList.add("active");

 document
 .getElementById("packsTab")
 .classList.remove("active");

 resetSelection();

 renderPackages(
 currentGame.uc
 );

};



document
.getElementById("packsTab")
.onclick=function(){

 this.classList.add("active");

 document
 .getElementById("ucTab")
 .classList.remove("active");

 resetSelection();

 renderPackages(
 currentGame.packs
 );

};



function resetSelection(){

 selectedPackage=null;

 quantity=1;

 qtyText.textContent="1";

 selectedText.textContent=
 "Select a package";

 totalText.textContent="—";

 validateOrder();

}



receiptInput.onchange=function(){

 var file=this.files[0];

 if(!file){

  receiptData=null;

  validateOrder();

  return;

 }


 if(!file.type.startsWith("image/")){

  alert(
  "Image file ပဲရွေးပေးပါ။"
  );

  this.value="";

  return;

 }

function validateOrder(){

 var valid=true;


 if(!currentGame){

  valid=false;

 }


 if(
 userId.value.trim()===""
 ){

  valid=false;

 }


 if(
 currentGame &&
 currentGame.id!=="heartopia" &&
 zoneId.value.trim()===""
 ){

  valid=false;

 }


 if(
 currentGame &&
 currentGame.id==="heartopia" &&
 aid.value.trim()===""
 ){

  valid=false;

 }


 if(!selectedPackage){

  valid=false;

 }


 if(!receiptData){

  valid=false;

 }


 confirmBtn.disabled=
 !valid;

}



userId.oninput=
validateOrder;

zoneId.oninput=
validateOrder;

aid.oninput=
validateOrder;
